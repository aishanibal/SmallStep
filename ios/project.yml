name: SmallStep
options:
  bundleIdPrefix: study.smallstep
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM: set in Xcode (Signing & Capabilities) the first time you run on a phone.
configFiles:
  Debug: Config.local.xcconfig
  Release: Config.local.xcconfig
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    # 2.50+ needs Swift tools 6.1 (Xcode 16.3). This Mac has Xcode 16.2 / Swift 6.0.
    minorVersion: 2.49.0
targets:
  SmallStep:
    type: application
    platform: iOS
    sources: [SmallStep]
    dependencies:
      - package: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: study.smallstep.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: SmallStep/Info.plist
      properties:
        CFBundleDisplayName: SmallStep
        UILaunchScreen: {}
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_PUBLISHABLE_KEY: $(SUPABASE_PUBLISHABLE_KEY)
        PARTICIPANT_EMAIL_DOMAIN: $(PARTICIPANT_EMAIL_DOMAIN)
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: SmallStep/SmallStep.entitlements
      properties:
        keychain-access-groups:
          - study.smallstep.app
  SmallStepTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SmallStepTests]
    dependencies:
      - target: SmallStep
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: study.smallstep.appTests
        GENERATE_INFOPLIST_FILE: YES
